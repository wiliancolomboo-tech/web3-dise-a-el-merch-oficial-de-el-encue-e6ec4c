[package]
name = "el_encuentro_merch"
version = "0.1.0"
description = "Phygital NFC-Linked Official Merch Protocol for El Encuentro 2026"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "el_encuentro_merch"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "=1.18.26"