[package]
name = "encuentro_merch"
version = "0.1.0"
description = "El Encuentro 2026 Phygital Merch Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "encuentro_merch"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
solana-program = "=1.18.26"